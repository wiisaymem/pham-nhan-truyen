          def download(item):
              p, (size, digest) = item
              request = urllib.request.Request('https://tutien.kentjuno.com/' + p, headers={'User-Agent':'Mozilla/5.0 faithful-owner-backup'})
              with urllib.request.urlopen(request, timeout=90) as response:
                  data = response.read()
              actual = hashlib.sha256(data).hexdigest()
              if len(data) != size or actual != digest:
                  raise RuntimeError('SOURCE MISMATCH ' + p + ' ' + str(len(data)) + ' ' + actual)
              return p, data, actual
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              downloaded = list(pool.map(download, expected.items()))
          for p, data, digest in downloaded:
              destination = pathlib.Path(p)
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)
              print(p, len(data), digest)
          print('VERIFIED', len(downloaded), 'FILES', sum(len(data) for _, data, _ in downloaded), 'BYTES')
          
      - name: Commit verified original game and remove temporary importer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'wiisaymem'
          git config user.email 'wiisaymem@users.noreply.github.com'
          git add -- index.html manifest.webmanifest sw.js js assets icons
          git rm -- .github/workflows/import-original.yml
          git commit -m 'Import 132 original game files byte-for-byte; verify all SHA-256'
          git push origin HEAD:main
